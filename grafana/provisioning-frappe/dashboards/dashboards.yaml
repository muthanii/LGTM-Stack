apiVersion: 1

providers:
  - name: Frappe
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # false = the file wins. Grafana marks the dashboard read-only in the UI and
    # offers "Copy JSON"/"Save JSON to file" instead of silently reverting edits
    # on the next restart. Edit dashboards/frappe/*.json and it reloads in ~30s.
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards-frappe
      foldersFromFilesStructure: false
