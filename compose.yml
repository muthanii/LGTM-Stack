services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_ADDR: "::"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - prometheus
      - tempo
      - mimir
    networks:
      - observability

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    networks:
      - observability
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_storage:/loki
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - prometheus_data:/prometheus
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - '3200:3200'
    command: -config.file=/etc/tempo/tempo-local.yaml
    volumes:
      - ./config/tempo-local.yaml:/etc/tempo/tempo-local.yaml:ro
      - tempo_storage:/var/tempo
    networks:
      - observability

  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: unless-stopped
    ports:
      - '9009:9009'
    command: -config.file=/etc/mimir/mimir-local.yaml
    volumes:
      - ./config/mimir-local.yaml:/etc/mimir/mimir-local.yaml:ro
      - mimir_data:/mimir
    networks:
      - observability

volumes:
  grafana_storage: {}
  loki_storage: {}
  prometheus_data: {}
  tempo_storage: {}
  mimir_data: {}

networks:
  observability:
    driver: bridge