name: Validate Compose

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose -f compose.yml config --quiet

      - name: Lint compose file
        run: |
          docker compose -f compose.yml config 2>&1 | grep -q "services:" && echo "✅ compose.yml is valid" || exit 1

      - name: Check YAML syntax
        run: |
          for f in compose.yml config/*.yaml grafana/provisioning/**/*.yaml; do
            echo "Checking $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "  ✅ valid"
          done
