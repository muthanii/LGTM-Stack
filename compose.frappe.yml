services:
  frappe-grafana:
    # Built, not pulled — dashboards and provisioning are baked in so no bind
    # mount can go stale on a WSL2 reboot. See Dockerfile.frappe-grafana.
    build:
      context: .
      dockerfile: Dockerfile.frappe-grafana
    image: frappe-grafana:local
    container_name: frappe-grafana
    restart: unless-stopped
    ports:
      # 3001 by default so this can run next to the LGTM stack (compose.yml) on 3000
      - '${FRAPPE_GRAFANA_PORT:-3001}:3000'
    environment:
      # Containers default to UTC; the host and the Frappe site are both
      # Asia/Baghdad (+03, no DST). Keeps container logs on your wall clock.
      TZ: ${TZ:-Asia/Baghdad}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SERVER_HTTP_ADDR: "::"
      # REST datasource — Frappe has no native Grafana protocol, it speaks HTTP/JSON
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      # Consumed by grafana/provisioning-frappe/datasources/frappe.yaml
      FRAPPE_URL: ${FRAPPE_URL:-https://teebatkarbala.frappe.cloud}
      # Frappe > your User doc > API Access > Generate Keys (secret is shown once).
      # Without these the log panels return 401.
      FRAPPE_API_KEY: ${FRAPPE_API_KEY:-}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET:-}
      # Frappe Cloud platform API (optional — panels 403 until these are set)
      FRAPPE_CLOUD_URL: ${FRAPPE_CLOUD_URL:-https://cloud.frappe.io}
      FRAPPE_CLOUD_API_KEY: ${FRAPPE_CLOUD_API_KEY:-}
      FRAPPE_CLOUD_API_SECRET: ${FRAPPE_CLOUD_API_SECRET:-}
      FRAPPE_CLOUD_SITE: ${FRAPPE_CLOUD_SITE:-}
    volumes:
      - frappe_grafana_storage:/var/lib/grafana
    depends_on:
      - frappe-prometheus
    networks:
      - frappe

  # Probes the site over HTTPS and reports latency, status code and TLS expiry.
  frappe-blackbox:
    image: prom/blackbox-exporter:latest
    container_name: frappe-blackbox
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    environment:
      TZ: ${TZ:-Asia/Baghdad}
    volumes:
      - ./config/frappe-blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - frappe

  # Stores the probe results. Own instance on 9091 so it never collides with
  # the LGTM stack's Prometheus on 9090.
  frappe-prometheus:
    image: prom/prometheus:latest
    container_name: frappe-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    environment:
      TZ: ${TZ:-Asia/Baghdad}
    ports:
      - '${FRAPPE_PROM_PORT:-9091}:9090'
    volumes:
      - ./config/frappe-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - frappe_prometheus_data:/prometheus
    depends_on:
      - frappe-blackbox
    networks:
      - frappe

volumes:
  frappe_grafana_storage: {}
  frappe_prometheus_data: {}

networks:
  frappe:
    driver: bridge
